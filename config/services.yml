# Symfony kernel (back office) services. Shared services come from common.yml; the rest is the
# read-only Stage 3 admin, wired like example-modules/demo_grid.
imports:
  - { resource: ./common.yml }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Summit\Wishlist\Controller\Admin\WishlistController: ~

  Summit\Wishlist\Admin\WishlistDetailProvider:
    arguments:
      $connection: '@doctrine.dbal.default_connection'
      $dbPrefix: '%database_prefix%'

  # Grid services
  Summit\Wishlist\Grid\Definition\Factory\WishlistGridDefinitionFactory:
    parent: 'prestashop.core.grid.definition.factory.abstract_grid_definition'
    autowire: false
    autoconfigure: false

  Summit\Wishlist\Grid\Query\WishlistQueryBuilder:
    parent: 'prestashop.core.grid.abstract_query_builder'
    autowire: true
    autoconfigure: false

  summitwishlist.grid.data_factory.doctrine:
    class: '%prestashop.core.grid.data.factory.doctrine_grid_data_factory%'
    autowire: false
    autoconfigure: false
    arguments:
      - '@Summit\Wishlist\Grid\Query\WishlistQueryBuilder'
      - '@prestashop.core.hook.dispatcher'
      - '@prestashop.core.grid.query.doctrine_query_parser'
      - 'summitwishlist'

  Summit\Wishlist\Grid\Data\WishlistGridDataFactory:
    arguments:
      $doctrineDataFactory: '@summitwishlist.grid.data_factory.doctrine'

  summitwishlist.grid.factory:
    class: 'PrestaShop\PrestaShop\Core\Grid\GridFactory'
    public: true
    autowire: false
    autoconfigure: false
    arguments:
      - '@Summit\Wishlist\Grid\Definition\Factory\WishlistGridDefinitionFactory'
      - '@Summit\Wishlist\Grid\Data\WishlistGridDataFactory'
      - '@prestashop.core.grid.filter.form_factory'
      - '@prestashop.core.hook.dispatcher'
